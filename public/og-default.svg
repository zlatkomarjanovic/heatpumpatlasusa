<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="HeatPumpAtlasUSA: data-driven US heat pump costs">
  <rect width="1200" height="630" fill="#f7f6f2"/>
  <rect x="0" y="0" width="1200" height="8" fill="#10475a"/>
  <g transform="translate(72 84)">
    <g transform="scale(2.4)">
      <rect width="32" height="32" rx="7" fill="#10475a"/>
      <path d="M9 21.5c0-4 2.6-6.2 5.5-8.2C16.8 11.8 18 10 18 7.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
