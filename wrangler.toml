name = "heatpumpatlasusa"
compatibility_date = "2026-09-14"
main = "./dist/_worker.js"

# Static Astro output. Cloudflare Git builds run `npm run build` then
# `npx wrangler deploy`. This file has to describe a Worker with assets,
# not a Pages-only project, or that deploy command fails.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Run the Worker on every request so HTTP and www redirects actually fire.
# Without this, Cloudflare serves index.html on http:// and returns 200.
run_worker_first = true

# Bind this after first deploy:
# wrangler kv namespace create LEADS
# [[kv_namespaces]]
# binding = "LEADS"
# id = "replace-me"
